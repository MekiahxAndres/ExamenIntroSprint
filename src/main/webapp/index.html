<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
<h1>Gestión de Expediciones y Misiones</h1>

<!--Solicitud HTTP-->
<h2>Registrar Expedición</h2>
<form action="sightings" method="POST">
    <input
            name="id"
            type="text"
            placeholder="Identificador">
    <input
            name="sightingId"
            type="text"
            placeholder="Código (A00123456)">
    <input
            name="name"
            type="text"
            placeholder="Nombre">
    <input
            name="description"
            type="text"
            placeholder="Descripción">
    <input
            name="scientificName"
            type="text"
            placeholder="Nombre Cientifico">
    <input
            name="sightingAt"
            type="text"
            placeholder="Fecha y Hora del Avistamiento">
    <input
            name="scientificName"
            type="text"
            placeholder="Nombre Cientifico">
    <input
            name="scientificName"
            type="text"
            placeholder="Nombre Cientifico">
    <button>Enviar</button>
</form>

<h2>Registrar curso</h2>
<form action="courses" method="POST">
    <input
            name="id"
            type="number"
            placeholder="Id del curso">
    <input
            name="name"
            type="text"
            placeholder="Nombre del curso">
    <input
            name="professorName"
            type="text"
            placeholder="Profesor">
    <input
            name="schedule"
            type="text"
            placeholder="Horario">
    <button>Enviar</button>
</form>

</body>
</html>
