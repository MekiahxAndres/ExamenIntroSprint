<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
<h1>Gestión de Expediciones y Misiones</h1>

<!--Solicitud HTTP-->
<h2>Registrar Expedición</h2>
<form action="sightings" method="POST">
    <input
            name="id"
            type="text"
            placeholder="Identificador">
    <input
            name="sightingId"
            type="text"
            placeholder="Código (A00123456)">
    <input
            name="name"
            type="text"
            placeholder="Nombre">
    <input
            name="description"
            type="text"
            placeholder="Descripción">
    <input
            name="scientificName"
            type="text"
            placeholder="Nombre Cientifico">
    <input
            name="sightingAt"
            type="text"
            placeholder="Fecha y Hora del Avistamiento">
    <input
            name="location"
            type="text"
            placeholder="Ubicación">
    <input
            name="quantity"
            type="number"
            placeholder="Cantidad de observaciones">
    <input
            name="confidenceLevel"
            type="text"
            placeholder="Nivel de Confidencialidad">
    <input
            name="expeditionId"
            type="text"
            placeholder="Id de la Expedición">
    <button>Enviar</button>
</form>

<h2>Registrar Expediciones</h2>
<form action="expeditions" method="POST">
    <input
            name="id"
            type="number"
            placeholder="Id de la expedición">
    <input
            name="name"
            type="text"
            placeholder="Nombre de la expedición">
    <input
            name="code"
            type="number"
            placeholder="identificador unico de la expedición">
    <input
            name="region"
            type="text"
            placeholder="Región">
    <input
            name="baseCamp"
            type="text"
            placeholder=" lugar donde se establece el campamento principal">
    <input
            name="leader"
            type="text"
            placeholder="Lider">
    <input
            name="startDate"
            type="text"
            placeholder="Fecha de inicio">
    <input
            name="endDate"
            type="text"
            placeholder="Fecha de Fin">
    <input
            name="state"
            type="text"
            placeholder="Estado">
    <button>Enviar</button>
</form>

</body>
</html>
